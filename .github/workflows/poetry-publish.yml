# This workflow uploads the new c2fj python package to pypi, every time a new release is created.
# The tests run first (the full tests.yml matrix), and publishing only happens if they pass.

name: Upload python package
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
      - name: Build package
        run: |
          python -m pip install --upgrade pip poetry
          poetry build
      # Note: consider migrating to PyPI Trusted Publishing (OIDC) and dropping the long-lived
      #  API token: https://docs.pypi.org/trusted-publishers/ (requires a one-time setup on PyPI).
      - name: Publish to pypi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
