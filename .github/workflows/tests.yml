# Note: add all job names to the deploy-status.needs.

name: Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test_programs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]
      - name: Install compilation dependencies
        run: |
          sudo apt-get install -y picolibc-riscv64-unknown-elf
      - name: Test pytest
        run: |
          pytest -n auto -vv --junitxml=./run-test-results.xml
      - name: Show tests results
        if: always()
        uses: pmeier/pytest-results-action@fdc7f18d9934e38aca411ca9557e6577bd25ca9c  # v0.9.0
        with:
          path: ./*-test-results.xml

  # This allows us to have a branch protection rule this entire workflow
  deploy-status:
    runs-on: ubuntu-latest
    needs: [ test_programs ]
    if: always()
    steps:
      - name: Successful deploy
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing deploy
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
