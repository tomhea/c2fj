[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "c2fj"
version = "1.0.1"
description = "A C to flipjump compiler"
authors = ["Tom Herman <flipjumpproject@gmail.com>"]
license = "BSD-2-Clause"
readme = "README.md"

homepage = "https://esolangs.org/wiki/FlipJump"
repository = "https://github.com/tomhea/c2fj"

keywords = ["esolang", "oisc", "assembly", "compiler"]
classifiers = [
    "Topic :: Education",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Other",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
flipjump = ">=1.3.0"
pyelftools = ">=0.33"

# development
pytest = { version = "^9.0.0", optional = true }
pytest-xdist = { version = "^3.8.0", optional = true }

[tool.poetry.extras]
tests = ["pytest", "pytest-xdist"]

[tool.poetry.scripts]
c2fj = 'c2fj.c2fj_main:main'
